# =============================================================================
#  Pedidos360 — stack completo con un comando
#  DSY1107 · Evaluación 3
#
#      cp .env.example .env        (una vez; ajustar CONSOLA_DIR / TIENDA_DIR)
#      docker compose up -d --build
#
#  Levanta, en este orden y esperando a que cada capa este SANA:
#
#      zookeeper1..3 -> kafka1..3 -> crear-topicos ─┐
#      rabbitmq1 -> rabbitmq2, rabbitmq3 ───────────┼-> microservicios -> tienda / consola
#      mysql, dynamodb-local ───────────────────────┘
#
#  Tres canales, cada uno para lo que sirve (ver PLAN-INTEGRACION-EV3.md §1):
#    REST      comandos transaccionales (reservar stock, crear pedido)
#    RabbitMQ  notificaciones al cliente, entrega por mensaje con DLQ
#    Kafka     log de eventos analiticos con replay y fan-out
#
#  infra/docker-compose.yml (Kafka) e infra/rabbitmq/docker-compose.yml (cluster
#  RabbitMQ) SIGUEN SIRVIENDO para levantar cada broker solo. Este archivo es el
#  camino de la demostracion completa.
#
#  MEMORIA: son 22 contenedores (~8-9 GB). Docker Desktop sobre WSL2 usa por
#  defecto la mitad de la RAM del equipo; con 16 GB conviene subirlo en
#  %UserProfile%\.wslconfig  ->  [wsl2]  memory=11GB
# =============================================================================

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.5.0
  # 512 MB por broker: todo el sistema tiene que convivir en un notebook. El
  # default de la imagen es 1 GB por JVM.
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT"
    KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNO"
    KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
    # --- Replicacion: con 3 brokers se puede exigir factor 3 ---
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2          # tolera la caida de 1 broker sin perder escrituras
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # los topicos se crean explicitamente (crear-topicos)
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # --- Defaults del broker; cada topico los sobreescribe segun su flujo ---
    KAFKA_LOG_RETENTION_HOURS: 168        # 7 dias
    KAFKA_LOG_RETENTION_BYTES: 1073741824 # 1 GB por particion
    KAFKA_LOG_CLEANUP_POLICY: "delete"
    KAFKA_LOG_SEGMENT_BYTES: 268435456    # 256 MB
  healthcheck:
    test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
    interval: 15s
    timeout: 10s
    retries: 12
    start_period: 40s
  restart: unless-stopped
  networks: [pedidos360]

x-zk-common: &zk-common
  image: confluentinc/cp-zookeeper:7.5.0
  environment: &zk-env
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    # Quorum de 3: tolera la caida de 1 nodo (2 de 3 siguen siendo mayoria).
    ZOOKEEPER_SERVERS: "zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888"
    ZOOKEEPER_4LW_COMMANDS_WHITELIST: "ruok,stat,srvr,conf,mntr"
    KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
  healthcheck:
    # 'ruok' NO sirve: desde ZK 3.5 esta fuera de la whitelist por defecto y la
    # variable de entorno no la traduce el script de Confluent. 'srvr' si esta
    # permitido y devuelve "Mode: leader|follower", que solo aparece cuando el
    # nodo esta sincronizado dentro del quorum.
    test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
    interval: 10s
    timeout: 5s
    retries: 10
  restart: unless-stopped
  networks: [pedidos360]

x-rabbitmq-common: &rabbitmq-common
  image: rabbitmq:3.13-management-alpine
  environment:
    # La cookie es la credencial con la que los nodos Erlang se aceptan entre
    # si: tiene que ser IDENTICA en los tres o no forman cluster.
    RABBITMQ_ERLANG_COOKIE: "${RABBITMQ_ERLANG_COOKIE:-pedidos360-cookie-dev}"
    RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-pedidos360}"
    RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-pedidos360}"
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 30s
  mem_limit: 512m
  restart: unless-stopped
  networks: [pedidos360]

# Variables comunes a TODOS los microservicios Spring.
x-spring-env: &spring-env
  # Entre contenedores se usa el listener INTERNO: kafka1:29092. El 9092 del
  # host no existe dentro de la red de Docker.
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
  SPRING_DATASOURCE_USERNAME: "root"
  SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASS:-123456}"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SPRING_JPA_SHOW_SQL: "false"
  # Los origenes desde los que un navegador llama a la API: consola y tienda, en
  # dev (Vite) y en Docker (nginx). El CORS declara rutas concretas y no un
  # comodin, asi que cambiar un puerto publicado obliga a cambiar esto.
  # HOST_PUBLICO es la direccion por la que el NAVEGADOR llega al sistema:
  # localhost en desarrollo, la IP publica de la EC2 en AWS. Los puertos 5173 y
  # 5174 (Vite) se dejan siempre: solo sirven en local y no estorban en AWS.
  # ORIGEN_TIENDA es el origen EXACTO que el navegador manda en la cabecera
  # Origin al servir la tienda. Es una variable aparte y no "host:puerto" porque
  # Spring compara el origen como texto: si la tienda se publica en el puerto 80
  # el navegador manda "http://IP" SIN puerto, y "http://IP:80" no coincide.
  # El ultimo es la tienda por HTTPS (login con Microsoft Azure Entra ID, que
  # solo acepta redirect URIs HTTPS fuera de localhost). Sin certificado montado
  # ese puerto no responde, pero el origen en la lista no estorba.
  CORS_ORIGENES: "http://localhost:5173,http://localhost:5174,http://${HOST_PUBLICO:-localhost}:8090,http://${HOST_PUBLICO:-localhost}:8091,${ORIGEN_TIENDA:-http://${HOST_PUBLICO:-localhost}:8091},https://${HOST_PUBLICO:-localhost}:${PUERTO_TIENDA_HTTPS:-8443}"
  # La JVM respeta el mem_limit del contenedor en vez de calcular su heap sobre
  # la RAM del host (que en un contenedor no le pertenece).
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  RABBITMQ_ADDRESSES: "rabbitmq1:5672,rabbitmq2:5672,rabbitmq3:5672"
  RABBITMQ_USER: "${RABBITMQ_USER:-pedidos360}"
  RABBITMQ_PASS: "${RABBITMQ_PASS:-pedidos360}"

x-ms-common: &ms-common
  mem_limit: 512m
  restart: unless-stopped
  networks: [pedidos360]

services:
  # ------------------------------------------------------------ Zookeeper
  zookeeper1:
    <<: *zk-common
    container_name: zookeeper1
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 1
    ports: ["2181:2181"]
    volumes:
      - zk1_data:/var/lib/zookeeper/data
      - zk1_log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zk-common
    container_name: zookeeper2
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 2
    ports: ["2182:2181"]
    volumes:
      - zk2_data:/var/lib/zookeeper/data
      - zk2_log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zk-common
    container_name: zookeeper3
    environment:
      <<: *zk-env
      ZOOKEEPER_SERVER_ID: 3
    ports: ["2183:2181"]
    volumes:
      - zk3_data:/var/lib/zookeeper/data
      - zk3_log:/var/lib/zookeeper/log

  # --------------------------------------------------------------- Brokers
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    depends_on:
      zookeeper1: { condition: service_healthy }
      zookeeper2: { condition: service_healthy }
      zookeeper3: { condition: service_healthy }
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: "INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNO://kafka1:29092,EXTERNO://${KAFKA_HOST:-localhost}:9092"
    volumes:
      - kafka1_data:/var/lib/kafka/data

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    depends_on:
      zookeeper1: { condition: service_healthy }
      zookeeper2: { condition: service_healthy }
      zookeeper3: { condition: service_healthy }
    ports: ["9093:9093"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: "INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNO://kafka2:29092,EXTERNO://${KAFKA_HOST:-localhost}:9093"
    volumes:
      - kafka2_data:/var/lib/kafka/data

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    depends_on:
      zookeeper1: { condition: service_healthy }
      zookeeper2: { condition: service_healthy }
      zookeeper3: { condition: service_healthy }
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: "INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094"
      KAFKA_ADVERTISED_LISTENERS: "INTERNO://kafka3:29092,EXTERNO://${KAFKA_HOST:-localhost}:9094"
    volumes:
      - kafka3_data:/var/lib/kafka/data

  # ------------------------------------------------------- Creacion de topicos
  # Contenedor de un solo uso que corre infra/kafka/crear-topicos.sh: los 4
  # topicos y sus 4 DLT con configuracion DISTINTA por flujo (particiones,
  # retencion, cleanup) y el porque de cada valor comentado en el script. No se
  # usa auto.create.topics porque crearia todo con los defaults del broker.
  crear-topicos:
    image: confluentinc/cp-kafka:7.5.0
    container_name: crear-topicos
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    environment:
      BOOTSTRAP: "kafka1:29092"
    volumes:
      - ./infra/kafka:/scripts:ro
    command: ["bash", "/scripts/crear-topicos.sh"]
    networks: [pedidos360]
    restart: "no"

  # -------------------------------------------------------------- Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: "pedidos360"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:29092,kafka2:29092,kafka3:29092"
      KAFKA_CLUSTERS_0_ZOOKEEPER: "zookeeper1:2181,zookeeper2:2181,zookeeper3:2181"
      DYNAMIC_CONFIG_ENABLED: "true"
    restart: unless-stopped
    networks: [pedidos360]

  # ------------------------------------------------------- Cluster RabbitMQ
  # 3 nodos con descubrimiento classic_config (infra/rabbitmq/rabbitmq.conf).
  # Las colas son quorum: replicadas por Raft en los 3 nodos, siguen aceptando
  # mensajes con uno caido. rabbitmq2 y 3 esperan a rabbitmq1 para que el
  # cluster se forme alrededor de un nodo ya arriba.
  rabbitmq1:
    <<: *rabbitmq-common
    container_name: rabbitmq1
    hostname: rabbitmq1
    ports: ["5672:5672", "15672:15672"]
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq1_data:/var/lib/rabbitmq

  rabbitmq2:
    <<: *rabbitmq-common
    container_name: rabbitmq2
    hostname: rabbitmq2
    ports: ["5673:5672", "15673:15672"]
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq2_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq1: { condition: service_healthy }

  rabbitmq3:
    <<: *rabbitmq-common
    container_name: rabbitmq3
    hostname: rabbitmq3
    ports: ["5674:5672", "15674:15672"]
    volumes:
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq3_data:/var/lib/rabbitmq
    depends_on:
      rabbitmq1: { condition: service_healthy }

  # ----------------------------------------------------------------- MySQL
  # Una instancia, una base por microservicio (pagos_db, productos_db,
  # carrito_db, notificaciones_db): ningun servicio lee tablas de otro. Las
  # bases las crea cada servicio con createDatabaseIfNotExist.
  mysql-db:
    image: mysql:8.0
    container_name: mysql-pedidos360
    environment:
      MYSQL_DATABASE: pagos_db
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASS:-123456}"
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASS:-123456}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks: [pedidos360]

  # -------------------------------------------------------- DynamoDB Local
  # Sustituto local de DynamoDB para desarrollo. En el Learner Lab
  # ms-recomendaciones apunta al DynamoDB real con DYNAMODB_ENDPOINT vacio.
  # -inMemory: los datos se pierden al reiniciar, a proposito (con un volumen la
  # imagen falla por permisos del usuario dynamodblocal sobre el directorio).
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    container_name: dynamodb-local
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]
    restart: unless-stopped
    networks: [pedidos360]

  # -------------------------------------------------------- Microservicios
  ms-pago:
    <<: *ms-common
    build: { context: ./ms-pago }
    container_name: ms-pago
    ports: ["8083:8083"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/pagos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      ANTIFRAUDE_PEPPER: "${ANTIFRAUDE_PEPPER:-pedidos360-dev}"
      # El returnUrl y los FRONT_URL los abre el NAVEGADOR, no otro contenedor:
      # tienen que ser direcciones alcanzables desde el host.
      # FRONT_URL_TIENDA es la pagina a la que vuelve el cliente despues de
      # pagar, asi que usa ORIGEN_TIENDA: si la tienda se publica en el puerto 80
      # el aterrizaje tras Webpay tambien queda sin puerto en la barra.
      PAGOS_RETURN_URL: "http://${HOST_PUBLICO:-localhost}:8083/api/pagos/commit"
      FRONT_URL: "http://${HOST_PUBLICO:-localhost}:8090"
      FRONT_URL_TIENDA: "${ORIGEN_TIENDA:-http://${HOST_PUBLICO:-localhost}:8091}"
    depends_on:
      mysql-db: { condition: service_healthy }
      crear-topicos: { condition: service_completed_successfully }

  ms-recomendaciones:
    <<: *ms-common
    build: { context: ./ms-recomendaciones }
    container_name: ms-recomendaciones
    ports: ["8084:8084"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8084
      # Sin ":" a proposito: si .env define DYNAMODB_ENDPOINT VACIO (Learner Lab),
      # se respeta el vacio y el SDK va al DynamoDB real de AWS.
      DYNAMODB_ENDPOINT: "${DYNAMODB_ENDPOINT-http://dynamodb-local:8000}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      # DynamoDB Local acepta cualquier credencial, pero el SDK exige alguna.
      # En el Learner Lab se reemplazan por las temporales (con SESSION_TOKEN).
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-local}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-local}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      DYNAMODB_PUBLICAR_OPERACIONES: "${DYNAMODB_PUBLICAR_OPERACIONES:-false}"
    depends_on:
      dynamodb-local: { condition: service_started }
      crear-topicos: { condition: service_completed_successfully }

  ms-kafka-admin:
    <<: *ms-common
    build: { context: ./ms-kafka-admin }
    container_name: ms-kafka-admin
    ports: ["8085:8085"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8085
    depends_on:
      crear-topicos: { condition: service_completed_successfully }

  ms-productos:
    <<: *ms-common
    build: { context: ./ms-productos }
    container_name: ms-productos
    ports: ["8086:8086"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/productos_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    depends_on:
      mysql-db: { condition: service_healthy }
      crear-topicos: { condition: service_completed_successfully }

  ms-carrito:
    <<: *ms-common
    build: { context: ./ms-carrito }
    container_name: ms-carrito
    ports: ["8087:8087"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8087
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/carrito_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      # Servidor a servidor: aca SI va el nombre del servicio en Docker.
      PRODUCTOS_URL: "http://ms-productos:8086"
      ENVIOS_AVANCE_MS: "${ENVIOS_AVANCE_MS:-20000}"
    depends_on:
      mysql-db: { condition: service_healthy }
      crear-topicos: { condition: service_completed_successfully }
      rabbitmq1: { condition: service_healthy }
      rabbitmq2: { condition: service_healthy }
      rabbitmq3: { condition: service_healthy }
      ms-productos: { condition: service_healthy }

  ms-notificaciones:
    <<: *ms-common
    build: { context: ./ms-notificaciones }
    container_name: ms-notificaciones
    ports: ["8088:8088"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8088
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-db:3306/notificaciones_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    depends_on:
      mysql-db: { condition: service_healthy }
      rabbitmq1: { condition: service_healthy }
      rabbitmq2: { condition: service_healthy }
      rabbitmq3: { condition: service_healthy }

  ms-rabbit-admin:
    <<: *ms-common
    build: { context: ./ms-rabbit-admin }
    container_name: ms-rabbit-admin
    ports: ["8089:8089"]
    environment:
      <<: *spring-env
      SERVER_PORT: 8089
      # Lista con failover: si rabbitmq1 cae, el listado sigue por los otros.
      RABBITMQ_MGMT_URL: "http://rabbitmq1:15672,http://rabbitmq2:15672,http://rabbitmq3:15672"
    depends_on:
      rabbitmq1: { condition: service_healthy }
      rabbitmq2: { condition: service_healthy }
      rabbitmq3: { condition: service_healthy }

  # -------------------------------------------------------------- Frontends
  # Son repositorios aparte, clonados AL LADO de este. La ruta se configura en
  # .env (CONSOLA_DIR / TIENDA_DIR) porque cada uno los clona con su nombre.
  # Las URL las consume el NAVEGADOR: van con localhost y el puerto publicado,
  # nunca con el nombre del servicio de Docker.
  tienda:
    build: { context: "${TIENDA_DIR:-../pedidos360-tienda}" }
    container_name: tienda
    # PUERTO_TIENDA: el puerto publicado de la pagina que ve el cliente. En
    # desarrollo 8091 (el 80 del host suele estar tomado en Windows); en AWS se
    # pone 80 en el .env para que la URL de la demo no muestre puerto. Al
    # cambiarlo hay que cambiar tambien ORIGEN_TIENDA (CORS y vuelta de Webpay).
    # PUERTO_TIENDA_HTTPS: la misma tienda con TLS, para el login con Microsoft
    # (Azure exige HTTPS). El entrypoint solo abre el 443 si encuentra
    # tienda.crt y tienda.key en TIENDA_SSL_DIR; en AWS es un certificado
    # autofirmado para la IP en /opt/pedidos360/ssl (ver despliegue/19-...).
    ports: ["${PUERTO_TIENDA:-8091}:80", "${PUERTO_TIENDA_HTTPS:-8443}:443"]
    volumes: ["${TIENDA_SSL_DIR:-./tienda-ssl}:/etc/nginx/ssl:ro"]
    environment:
      API_PRODUCTOS: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8086}"
      API_CARRITO: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8087}"
      API_PAGOS: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8083}"
      API_RECOMENDACIONES: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8084}"
      API_NOTIFICACIONES: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8088}"
      # Identidad (fase 4, §12): la tienda pide el ID token a Cognito y el API
      # Gateway lo valida en las rutas de identidad. Vacio = sin login, pero el
      # catalogo y el carrito funcionan igual. El user pool se recrea cuando
      # caduca el Learner Lab, por eso es configuracion y no va en el bundle.
      COGNITO_REGION: "${COGNITO_REGION:-us-east-1}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:-}"
      COGNITO_POOL_ID: "${COGNITO_POOL_ID:-}"
    depends_on:
      ms-productos: { condition: service_healthy }
      ms-carrito: { condition: service_healthy }
      ms-pago: { condition: service_healthy }
    restart: unless-stopped
    networks: [pedidos360]

  consola:
    build: { context: "${CONSOLA_DIR:-../cloud-ev3-front}" }
    container_name: consola
    ports: ["8090:80"]
    environment:
      API_PAGOS: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8083}"
      API_RECOMENDACIONES: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8084}"
      API_ADMIN: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8085}"
      API_PRODUCTOS: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8086}"
      API_RABBIT: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8089}"
      API_NOTIFICACIONES: "${API_BASE:-http://${HOST_PUBLICO:-localhost}:8088}"
      # El WebSocket NO pasa por el API Gateway REST: un stream no atraviesa una
      # integracion HTTP (la respuesta se bufferea). Va directo a
      # ms-recomendaciones, o al wss:// de una API de tipo WebSocket.
      WS_URL: "${WS_URL:-ws://${HOST_PUBLICO:-localhost}:8084/ws/metricas}"
    depends_on:
      ms-pago: { condition: service_healthy }
      ms-recomendaciones: { condition: service_healthy }
      ms-kafka-admin: { condition: service_healthy }
    restart: unless-stopped
    networks: [pedidos360]

networks:
  pedidos360:
    driver: bridge

volumes:
  zk1_data: {}
  zk1_log: {}
  zk2_data: {}
