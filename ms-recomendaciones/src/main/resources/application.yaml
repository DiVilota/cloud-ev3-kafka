spring:
  application:
    name: ms-recomendaciones

  # Sin base relacional: el historial y las recomendaciones viven en DynamoDB.
  # La configuracion del cliente Kafka NO va aca sino en Config/KafkaConfig.java,
  # donde cada propiedad esta explicita y comentada (criterio 1 de la pauta).
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    listener:
      # Si el topico aun no existe (crear-topicos todavia no corrio) el servicio
      # arranca igual y se suscribe cuando aparezca.
      missing-topics-fatal: false

app:
  kafka:
    topicos:
      interacciones: interacciones-user
      catalogo: catalogo-productos
      # Sufijo que usa DeadLetterPublishingRecoverer por defecto: <topico>.DLT
      sufijo-dlt: .DLT
    grupos:
      recomendaciones: grupo-recomendaciones
      dashboard: grupo-dashboard
      catalogo: grupo-catalogo-recomendaciones
      dlt: grupo-dlt-recomendaciones
    concurrencia:
      # 3 hilos se reparten las 6 particiones de interacciones-user (reparto).
      recomendaciones: 3
      # El dashboard agrega en memoria: un solo hilo evita contencion y no
      # necesita mas, solo cuenta.
      dashboard: 1
      catalogo: 1
    reintentos:
      # Backoff exponencial 1 s, x2, maximo 10 s, 3 reintentos (§3.4).
      intervalo-inicial-ms: 1000
      multiplicador: 2.0
      intervalo-maximo-ms: 10000
      maximo: 3

  recomendaciones:
    # Ventana del perfil del usuario: los ultimos N eventos.
    ventana-eventos: 100
    top: 5

  metricas:
    # Cada cuanto se difunde el snapshot por /ws/metricas.
    difusion-ms: 2000

  dynamodb:
    # false = repositorios en memoria (pruebas o desarrollo sin DynamoDB Local).
    habilitado: ${DYNAMODB_HABILITADO:true}
    # Vacio = AWS real con la cadena de credenciales por defecto (incluye
    # AWS_SESSION_TOKEN del Learner Lab). En compose: http://dynamodb-local:8000
    endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    crear-tablas: ${DYNAMODB_CREAR_TABLAS:true}
    # Solo si hay una Lambda escuchando el stream tiene sentido escribir el
    # snapshot cada 5 s; en local seria gasto sin lector.
    publicar-operaciones: ${DYNAMODB_PUBLICAR_OPERACIONES:false}
    operaciones-ms: 5000
    # Los eventos de operaciones son telemetria: el TTL los borra solos.
    operaciones-ttl-horas: 24
    tablas:
      historial: ${DYNAMODB_TABLA_HISTORIAL:HistorialEventos}
      recomendaciones: ${DYNAMODB_TABLA_RECOMENDACIONES:RecomendacionesUsuario}
      # Mismo nombre que crea infra/terraform-telemetria (EventosOperaciones-<entorno>),
      # para que la Lambda Procesador lea lo que este servicio escribe.
      operaciones: ${DYNAMODB_TABLA_OPERACIONES:EventosOperaciones-desarrollo}
      auditoria: ${DYNAMODB_TABLA_AUDITORIA:pedidos360-auditoria}

  auditoria:
    dynamo:
      # Consumidor auditoria-eventos -> tabla DynamoDB. Apagado por defecto
      # (pruebas sin DynamoDB); el compose lo enciende.
      habilitado: ${AUDITORIA_DYNAMO_HABILITADO:false}
      topico: auditoria-eventos
      grupo: grupo-auditoria-dynamo

  cors:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:5173,http://localhost:5174,http://localhost:8090,http://localhost:8091}

# -----------------------------------------------------------------------------
# Actuator: solo health. El resto (env, beans, heapdump) filtra configuracion y
# credenciales sin autenticacion, y aca no hay Spring Security que los cubra.
# -----------------------------------------------------------------------------
management:
  endpoints:
    web:
      # Actuator NO pasa por el CorsConfig de MVC: lo atiende su propio
      # handler mapping, que sólo lee estas propiedades. Sin esto el navegador
      # bloquea el sondeo de /actuator/health y los frontends muestran el
      # servicio como caído estando arriba.
      cors:
        allowed-origins: ${CORS_ORIGENES:http://localhost:5173,http://localhost:5174,http://localhost:8090,http://localhost:8091}
        allowed-methods: GET
        max-age: 3600s
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8084}
